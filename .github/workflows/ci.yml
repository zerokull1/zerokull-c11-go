name: ZEROKULL Hardened CI
on: [push, pull_request]
jobs:
  build-and-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc clang llvm libbpf-dev libelf-dev zlib1g-dev linux-tools-common linux-tools-generic
      - name: Build & Unit Tests
        run: make && make test
      - name: Static Analyzer & ASan + UBSan
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -fanalyzer -Iinclude -Ibuild src/engine.c tests/test_suite.c -o /tmp/zk_fa && /tmp/zk_fa
          gcc -O2 -std=c11 -Wall -Wextra -Werror -fanalyzer -Iinclude -Ibuild src/stat.c -o /tmp/zk_stat_fa
          gcc -O1 -g -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude src/engine.c tests/test_suite.c -o /tmp/zk_asan && /tmp/zk_asan
