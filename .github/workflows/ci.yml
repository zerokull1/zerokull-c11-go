name: C11 & eBPF XDP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install eBPF & C11 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev linux-tools-common linux-tools-generic
      - name: Build XDP object & C11 engine
        run: |
          make build/xdp_guard.bpf.o build/test_suite
      - name: Run deterministic verification suite
        run: |
          make test
