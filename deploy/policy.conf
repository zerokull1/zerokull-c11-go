# ZEROKULL (zerokull1) | Declarative Appliance Policy (/etc/zeromani/policy.conf)
# Reload on the fly without packet loss: kill -HUP $(pidof zerokull-daemon)

# Operation mode: enforce | shadow
mode = enforce

# Optional CPU core pinning (0..N-1), comment out for OS scheduler
# cpu_affinity = 2

# Trusted management / uplink IPv4 addresses (bypass XDP drop, still L7 inspected)
# allow_ip = 10.0.0.10

# Static perimeter blacklist IPv4 addresses (instant XDP_DROP)
# deny_ip = 192.0.2.55
